{{define "nav.html"}}
<style>
.topnav{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(0,0,0,.06)}
.topnav .logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:#1a1a2e;text-decoration:none;letter-spacing:-.02em}
.topnav .logo-icon{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff}
.topnav .nav-links{display:flex;align-items:center;gap:2px}
.topnav .nav-links a{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;color:#64748b;text-decoration:none;transition:all .15s;letter-spacing:-.01em}
.topnav .nav-links a:hover{color:#1a1a2e;background:rgba(0,0,0,.03)}
.topnav .nav-links a.active{color:#1a1a2e;background:rgba(0,0,0,.04);font-weight:600}
.topnav .nav-right{display:flex;align-items:center;gap:10px;font-size:11px;color:#94a3b8}
.topnav .nav-right .prom-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}
.topnav .nav-right .prom-dot.ok{background:#22c55e}
.topnav .nav-right .prom-dot.err{background:#ef4444}
.topnav .nav-right .btn-nav{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:#64748b;border:1px solid rgba(0,0,0,.08);transition:.15s}
.topnav .nav-right .btn-nav:hover{background:rgba(0,0,0,.03);color:#475569}
.topnav .nav-right .btn-nav.primary{background:#1a1a2e;color:#fff;border:none}
.topnav .nav-right .btn-nav.primary:hover{background:#2d2d44}
.topnav .nav-right .theme-btn{cursor:pointer;font-size:14px;opacity:.7;transition:.15s}
.topnav .nav-right .theme-btn:hover{opacity:1}
</style>

<nav class="topnav">
  <a href="/" class="logo">
    <div class="logo-icon">◆</div>
    kops
  </a>
  <div class="nav-links">
    <a href="/" class="{{if eq .Active "overview"}}active{{end}}">总览</a>
    <a href="/recommendations" class="{{if eq .Active "recommendations"}}active{{end}}">资源推荐</a>
    <a href="/efficiency" class="{{if eq .Active "efficiency"}}active{{end}}">流量效率</a>
    <a href="/health" class="{{if eq .Active "health"}}active{{end}}">健康状态</a>
    <a href="/cluster" class="{{if eq .Active "cluster"}}active{{end}}">集群分析</a>
    <a href="/topology" class="{{if eq .Active "topology"}}active{{end}}">业务拓扑</a>
  </div>
  <div class="nav-right">
    <span style="display:flex;align-items:center;gap:5px" id="promStatus" title="Prometheus 连接状态">
      <span class="prom-dot" id="promDot"></span>
      <span id="promLabel">Prometheus</span>
    </span>
    <span style="color:#94a3b8" id="updateTime">更新于 {{.LastUpdated}}</span>
    <button class="btn-nav primary" id="refreshBtn" onclick="syncData()">同步</button>
    <span class="theme-btn" onclick="toggleTheme()" title="切换暗色模式" id="themeIcon">🌙</span>
  </div>
</nav>

<!-- Spacer since nav is fixed -->
<div style="height:48px"></div>

<style>
[data-theme="dark"] body{background:#0f172a!important;color:#e2e8f0}
[data-theme="dark"] .topnav{background:rgba(15,23,42,.85)!important;border-bottom-color:rgba(255,255,255,.06)!important}
[data-theme="dark"] .topnav .logo{color:#e2e8f0}
[data-theme="dark"] .topnav .nav-links a{color:#94a3b8}
[data-theme="dark"] .topnav .nav-links a:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
[data-theme="dark"] .topnav .nav-links a.active{color:#e2e8f0;background:rgba(255,255,255,.08)}
[data-theme="dark"] .topnav .nav-right .btn-nav{color:#94a3b8;border-color:rgba(255,255,255,.08)}
[data-theme="dark"] .topnav .nav-right .btn-nav.primary{background:#6366f1;color:#fff}
[data-theme="dark"] .topnav .nav-right .btn-nav:hover{color:#e2e8f0}
[data-theme="dark"] .s-card, [data-theme="dark"] .card, [data-theme="dark"] .svc-card, [data-theme="dark"] .card-page,
[data-theme="dark"] .chart-box, [data-theme="dark"] .trend-card, [data-theme="dark"] .rec-card,
[data-theme="dark"] .summary .s-card{background:#1e293b!important;border-color:rgba(255,255,255,.06)!important}
[data-theme="dark"] .s-num, [data-theme="dark"] .sm-val, [data-theme="dark"] .svc-name, [data-theme="dark"] .metric-col .val,
[data-theme="dark"] .card-header, [data-theme="dark"] .score-num, [data-theme="dark"] .spend-col .spend-val,
[data-theme="dark"] .scaling-title, [data-theme="dark"] .saving-col .saving-val{color:#e2e8f0!important}
[data-theme="dark"] .svc-ns, [data-theme="dark"] .s-lbl, [data-theme="dark"] .sm-lbl, [data-theme="dark"] .lbl,
[data-theme="dark"] .e-label, [data-theme="dark"] .scaling-detail, [data-theme="dark"] .search-row input::placeholder,
[data-theme="dark"] .s-lbl, [data-theme="dark"] .metric-col .lbl{color:#94a3b8!important}
[data-theme="dark"] .chip{background:#1e293b;border-color:rgba(255,255,255,.08);color:#94a3b8}
[data-theme="dark"] .chip.active{background:#e2e8f0;color:#0f172a;border-color:#e2e8f0}
[data-theme="dark"] .chip:hover{color:#e2e8f0;border-color:rgba(255,255,255,.15)}
[data-theme="dark"] table thead th{background:rgba(255,255,255,.03);color:#94a3b8;border-bottom-color:rgba(255,255,255,.06)}
[data-theme="dark"] table tbody td{border-bottom-color:rgba(255,255,255,.03)}
[data-theme="dark"] table tbody tr:hover{background:rgba(99,102,241,.08)}
[data-theme="dark"] .search-input, [data-theme="dark"] .page-size-select, [data-theme="dark"] .search-row input{background:#1e293b;border-color:rgba(255,255,255,.08);color:#e2e8f0}
[data-theme="dark"] .search-input:focus, [data-theme="dark"] .search-row input:focus{border-color:#6366f1}
[data-theme="dark"] .expand, [data-theme="dark"] .expand-panel{background:rgba(255,255,255,.02);border-top-color:rgba(255,255,255,.04)}
[data-theme="dark"] .expand-value{color:#e2e8f0}
[data-theme="dark"] .topo-bar{background:rgba(15,23,42,.85)!important;border-bottom-color:rgba(255,255,255,.04)!important}
[data-theme="dark"] .topo-legend, [data-theme="dark"] .topo-search{background:rgba(30,41,59,.85)!important;border-color:rgba(255,255,255,.06)!important;color:#94a3b8}
[data-theme="dark"] .topo-search input{color:#e2e8f0}
[data-theme="dark"] #topo-canvas{background:#0f172a}
[data-theme="dark"] .btn-nav, [data-theme="dark"] .btn-action{color:#94a3b8;border-color:rgba(255,255,255,.1)}
[data-theme="dark"] .btn-nav:hover, [data-theme="dark"] .btn-action:hover{background:rgba(255,255,255,.06)}
[data-theme="dark"] .alert-danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2)}
[data-theme="dark"] .alert-warning{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.2)}
</style>
{{end}}
