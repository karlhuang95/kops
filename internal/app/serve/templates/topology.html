{{define "topology.html"}}
{{template "head.html" .}}
<style>
#topo-app{position:fixed;top:48px;left:0;right:0;bottom:0;background:#fafbfc;font-family:"Inter",-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
#topo-canvas{position:absolute;inset:0}
#topo-canvas svg{width:100%;height:100%;display:block}

/* Bar */
.topo-bar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 20px;background:rgba(250,251,252,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.04)}
.topo-bar .stat{text-align:center}
.topo-bar .stat .n{font-size:20px;font-weight:900;letter-spacing:-.03em;line-height:1}
.topo-bar .stat .l{font-size:10px;color:#94a3b8;font-weight:500}
.topo-tabs{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.04);border-radius:9px}
.topo-tabs button{padding:5px 16px;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:#94a3b8;transition:.2s}
.topo-tabs button.active{background:#1a1a2e;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.topo-bar .btn{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid rgba(0,0,0,.08);background:#fff;color:#64748b;transition:.2s}
.topo-bar .btn:hover{background:#f1f5f9}
.topo-bar .btn.primary{background:#1a1a2e;color:#fff;border:none}
.topo-bar .btn.primary:hover{background:#2d2d44}

/* Legend */
.topo-legend{position:absolute;bottom:16px;left:16px;z-index:10;display:flex;gap:12px;padding:6px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-radius:9px;border:1px solid rgba(0,0,0,.05);font-size:10px;color:#64748b}
.topo-legend .chip{cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s;padding:2px 6px;border-radius:4px}
.topo-legend .chip:hover{background:rgba(0,0,0,.03)}
.topo-legend .chip.active{background:rgba(0,0,0,.05)}

#topo-tip{position:absolute;pointer-events:none;background:#1a1a2e;color:#fff;padding:5px 10px;border-radius:7px;font-size:11px;z-index:20;display:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.topo-popover{position:absolute;z-index:20;background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.06);padding:16px;min-width:200px;max-width:300px;display:none}
.topo-popover .close{position:absolute;top:8px;right:12px;cursor:pointer;color:#94a3b8;font-size:16px;line-height:1}
</style>
<body>
{{template "nav.html" .}}
<div id="topo-app">
  <div id="topo-canvas">
    <div class="topo-bar">
      <div class="topo-tabs">
        <button class="active" data-tab="graph">架构图</button>
        <button data-tab="lookup">依赖查询</button>
      </div>
      <div class="stat"><div class="n" style="color:#6366f1" id="statCalls">-</div><div class="l">调用链路</div></div>
      <div class="stat"><div class="n" style="color:#06b6d4" id="statSvc">-</div><div class="l">服务节点</div></div>
      <div class="stat"><div class="n" style="color:#10b981" id="statNS">-</div><div class="l">命名空间</div></div>
      <input type="text" id="topoSearch" placeholder="搜索服务..." style="display:none;padding:5px 12px;border:1px solid rgba(0,0,0,.08);border-radius:7px;font-size:11px;width:110px;background:rgba(0,0,0,.03);color:#1a1a2e;font-family:inherit;outline:none;transition:.2s" onfocus="this.style.background='#fff';this.style.borderColor='rgba(0,0,0,.15)'" onblur="this.style.background='rgba(0,0,0,.03)';this.style.borderColor='rgba(0,0,0,.08)'">
      <button class="btn" onclick="cleanupTopo()">清理</button>
      <button class="btn primary" onclick="refreshTopo()">刷新</button>
    </div>

    <div class="topo-legend" id="legend">
      <span class="chip active" data-filter="all">全部</span>
      <span class="chip" data-filter="Critical"><span style="width:7px;height:7px;border-radius:50%;background:#ef4444"></span>严重</span>
      <span class="chip" data-filter="Warning"><span style="width:7px;height:7px;border-radius:50%;background:#f97316"></span>警告</span>
      <span class="chip" data-filter="Healthy"><span style="width:7px;height:7px;border-radius:50%;background:#22c55e"></span>健康</span>
      <span style="color:#e2e8f0;margin:0 2px">|</span>
      <span class="chip active" data-layer="calls"><span style="width:12px;height:2px;background:#f59e0b;border-radius:1px"></span>调用</span>
      <span class="chip active" data-layer="routes"><span style="width:12px;height:1px;background:#6366f1;border-top:1px dashed #6366f1"></span>路由</span>
    </div>

    <svg id="topoSvg"></svg>
    <div id="topo-tip"></div>
    <div class="topo-popover" id="topoPopover"><span class="close" onclick="document.getElementById('topoPopover').style.display='none'">&times;</span><div id="topoPopoverContent"></div></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function(){
var svg=d3.select('#topoSvg'),canvas=document.getElementById('topo-canvas'),tip=d3.select('#topo-tip'),pop=d3.select('#topoPopover'),popC=d3.select('#topoPopoverContent');
var NC=['#6366f1','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ec4899','#3b82f6','#14b8a6'],nsi=0,nsm={};
function nsc(ns){if(!nsm[ns]){nsm[ns]=NC[nsi%NC.length];nsi++}return nsm[ns]}
function hcc(c){return c==='Critical'?'#ef4444':c==='Warning'?'#f97316':c==='Healthy'?'#22c55e':'#94a3b8'}
function fmt(n){return n>=1000?(n/1000).toFixed(1)+'k':''+n}

var tab='graph',lkp=null,gd,ne,ee,cFilter='all',cLayers={calls:true,routes:true};

// Tabs
document.querySelectorAll('.topo-tabs button').forEach(function(b){b.onclick=function(){
  tab=this.dataset.tab;document.querySelectorAll('.topo-tabs button').forEach(function(x){x.classList.remove('active')});this.classList.add('active');
  document.getElementById('topoSearch').style.display=tab==='lookup'?'':'none';
  if(gd)tab==='lookup'?renderLookup():renderGraph()}});

// Legend chips
document.querySelectorAll('#legend .chip').forEach(function(c){c.onclick=function(){
  var f=this.dataset.filter,l=this.dataset.layer;
  if(f){cFilter=f;document.querySelectorAll('#legend .chip[data-filter]').forEach(function(x){x.classList.remove('active')});this.classList.add('active');applyFilter()}
  if(l){cLayers[l]=!cLayers[l];if(cLayers[l])this.classList.add('active');else this.classList.remove('active');applyLayers()}}});

// Search
document.getElementById('topoSearch').addEventListener('input',function(){var q=this.value.toLowerCase().trim();
  if(tab==='graph'&&ne){ne.attr('opacity',function(){return q?((this.getAttribute('data-id')||'').toLowerCase().indexOf(q)>=0?1:.06):1});if(ee)ee.attr('opacity',q?.06:1)}
  if(tab==='lookup'&&q.length>=2&&gd){var ds=gd.nodes.filter(function(n){return n.group==='Deployment'}),f=null;ds.forEach(function(d){if(d.id.toLowerCase().indexOf(q)>=0||(d.id.split('/')[1]||'').toLowerCase().indexOf(q)>=0)f=d.id});if(f){lkp=f;renderLookup()}}});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('topoSearch').focus()}});

function applyFilter(){
  if(!ne)return;
  ne.attr('opacity',function(){
    if(cFilter==='all')return 1;
    var n=gd.nodes.find(function(x){return x.id===this.getAttribute('data-id')});if(!n||(n.group!=='Deployment'&&n.group!=='K8sService'))return .05;
    return((n.properties&&n.properties.healthCode)||'')===cFilter?1:.05},ne)}


function applyLayers(){if(!ee)return;ee.attr('display',function(){var t=this.getAttribute('data-tp');if(t==='CALLS'&&!cLayers.calls)return'none';if(t==='ROUTES_TO'&&!cLayers.routes)return'none';return null})}

function load(){
  fetch('/api/topology/graph').then(function(r){return r.json()}).then(function(d){
    if(d.error||!d.nodes||!d.nodes.length){svg.html('<text x="30" y="60" fill="#94a3b8" font-size="13">'+(d.error||'暂无数据，请刷新')+'</text>');return}
    gd=d;tab==='lookup'?renderLookup():renderGraph()}).catch(function(e){svg.html('<text x="30" y="60" fill="#ef4444">'+e.message+'</text>')})}

// ========== GRAPH ==========
function renderGraph(){
  svg.selectAll('*').remove();ne=null;ee=null;
  var W=Math.max(canvas.clientWidth||1400,1200),H=Math.max(canvas.clientHeight||800,680);
  svg.attr('width',W).attr('height',H);

  var nm={};gd.nodes.forEach(function(n){nm[n.id]=n});
  var ex=[],ep=[],ns=[],dp=[],ks=[],js=[];
  gd.nodes.forEach(function(n){if(n.group==='External')ex.push(n);else if(n.group==='Entrypoint')ep.push(n);else if(n.group==='Namespace')ns.push(n);else if(n.group==='K8sService')ks.push(n);else if(n.group==='JaegerService')js.push(n);else if(n.group==='Deployment')dp.push(n)});

  var ng={};ns.forEach(function(n){ng[n.id]=[]});dp.forEach(function(d){var nn=(d.properties&&d.properties.namespace)||'';if(!ng[nn])ng[nn]=[];ng[nn].push(d)});
  var nk=Object.keys(ng).filter(function(k){return ng[k].length>0});

  var cEdges=gd.edges.filter(function(e){return e.type==='CALLS'});
  document.getElementById('statCalls').textContent=cEdges.length;
  document.getElementById('statSvc').textContent=dp.length;
  document.getElementById('statNS').textContent=nk.length;

  var M={t:44,r:30,b:30,l:30},gc=50,nH=30,nG=6,nP={t:38,r:18,b:18,l:18};
  var ew=80,nw=Math.min(240,Math.max(170,(W-M.l-M.r-gc)/Math.max(nk.length,1)));
  var cs=[];cs.push({x:M.l+ew/2,w:ew});nk.forEach(function(k,i){cs.push({x:M.l+ew+gc+nw/2+i*(nw+gc),w:nw})});

  var np={};ex.forEach(function(n){np[n.id]={x:cs[0].x,y:M.t+10,r:10,grp:'External'}});ep.forEach(function(n,i){np[n.id]={x:cs[0].x,y:M.t+50+i*36,r:8,grp:'Entrypoint'}});
  nk.forEach(function(k,ci){var c=cs[1+ci],m=ng[k]||[],nM=Math.max(m.length,1),cw=c.w-nP.l-nP.r,ch=nM*(nH+nG)-nG;
    c._x=c.x;c._y=M.t;c._w=c.w;c._h=nP.t+ch+nP.b;
    m.forEach(function(d,i){np[d.id]={x:c.x,y:c._y+nP.t+i*(nH+nG)+nH/2,w:cw-6,h:nH,grp:'Deployment',ns:k}})});

  var defs=svg.append('defs');
  defs.append('pattern').attr('id','dot').attr('width',40).attr('height',40).attr('patternUnits','userSpaceOnUse').append('circle').attr('cx',20).attr('cy',20).attr('r',.5).attr('fill','rgba(0,0,0,.035)');
  [{id:'ac',c:'#f59e0b'},{id:'ah',c:'#ea580c'},{id:'ar',c:'#6366f1'}].forEach(function(a){defs.append('marker').attr('id',a.id).attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-4L8,0L0,4Z').attr('fill',a.c)});
  defs.append('filter').attr('id','sh').html('<feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.05"/>');

  var g=svg.append('g');svg.call(d3.zoom().scaleExtent([.2,5]).on('zoom',function(e){g.attr('transform',e.transform)}));
  g.append('rect').attr('width',W*3).attr('height',H*3).attr('x',-W).attr('y',-H).attr('fill','url(#dot)');

  // Containers
  nk.forEach(function(k,ci){var c=cs[1+ci],co=nsc(k);
    g.append('rect').attr('x',c._x-c._w/2).attr('y',c._y).attr('width',c._w).attr('height',c._h).attr('rx',12).attr('fill','#fff').attr('stroke','rgba(0,0,0,.05)').attr('stroke-width',1).attr('filter','url(#sh)');
    g.append('rect').attr('x',c._x-c._w/2).attr('y',c._y).attr('width',c._w).attr('height',30).attr('rx',12).attr('fill',co).attr('opacity',.06);
    g.append('circle').attr('cx',c._x-c._w/2+16).attr('cy',c._y+15).attr('r',3.5).attr('fill',co);
    g.append('text').attr('x',c._x-c._w/2+24).attr('y',c._y+19).style('font-size','10px').style('font-weight','700').style('fill','#0f172a').text(k);
    g.append('text').attr('x',c._x+c._w/2-12).attr('y',c._y+19).style('font-size','9px').style('fill','#94a3b8').style('text-anchor','end').text(ng[k].length+' 服务')});

  // Left label
  g.append('text').attr('x',cs[0].x).attr('y',14).attr('text-anchor','middle').style('font-size','9px').style('fill','#94a3b8').style('font-weight','600').text('入口');

  // Edges
  ee=[];var eg=g.append('g');
  gd.edges.forEach(function(e){var s=np[e.source],t=np[e.target];if(!s||!t)return;var ic=e.type==='CALLS',ir=e.type==='ROUTES_TO';if(!ic&&!ir)return;
    var cc=e.properties&&e.properties.callCount||0,sw=ic?Math.max(1.2,Math.min(Math.log10(cc+1)*2,4)):1;
    var eg2=eg.append('g').attr('data-s',e.source).attr('data-t',e.target).attr('data-tp',e.type);
    eg2.append('path').attr('d',epath(s,t,ic)).attr('fill','none').attr('stroke',ic?'#f59e0b':'#6366f1').attr('stroke-width',sw).attr('stroke-dasharray',ir?'5,3':null).attr('stroke-opacity',ic?.5:.3).attr('marker-end',ic?'url(#ac)':'url(#ar)').attr('stroke-linecap','round');
    if(ic&&cc>0){var mx=(s.x+t.x)/2,my=(s.y+t.y)/2-8,l=fmt(cc),tw=l.length*5+10;eg2.append('rect').attr('x',mx-tw/2).attr('y',my-7).attr('width',tw).attr('height',14).attr('rx',4).attr('fill','#fffbeb').attr('stroke','#f59e0b').attr('stroke-width',.5);eg2.append('text').attr('x',mx).attr('y',my+3).attr('text-anchor','middle').style('font-size','7.5px').style('fill','#b45309').style('font-weight','700').text(l)}
    ee.push(eg2)});

  // Nodes
  ne=[];var ng2=g.append('g');
  Object.keys(np).forEach(function(id){var p=np[id],n=nm[id];if(!n)return;var el=ng2.append('g').attr('data-id',id).attr('cursor','pointer').attr('transform','translate('+p.x+','+p.y+')'),bw=p.w||90,bh=p.h||nH;
    if(n.group==='Entrypoint'){el.append('polygon').attr('points',[-7,0,0,-6,7,0,0,6].join(' ')).attr('fill','#f43f5e').attr('stroke','#fff').attr('stroke-width',2);el.append('text').attr('x',12).attr('y',4).style('font-size','9px').style('fill','#64748b').style('font-weight','600').text(id)}
    else if(n.group==='External'){el.append('circle').attr('r',9).attr('fill','#94a3b8').attr('stroke','#fff').attr('stroke-width',2);el.append('text').attr('x',13).attr('y',4).style('font-size','9px').style('fill','#94a3b8').text('外部')}
    else{var hcv=n.properties&&n.properties.healthCode,co=hcv?hcc(hcv):'#6366f1';el.append('rect').attr('x',-bw/2).attr('y',-bh/2).attr('width',bw).attr('height',bh).attr('rx',7).attr('fill','#fff').attr('stroke',co).attr('stroke-width',1.5).attr('filter','url(#sh)');el.append('rect').attr('x',-bw/2).attr('y',-bh/2).attr('width',3).attr('height',bh).attr('rx',1.5).attr('fill',co);el.append('circle').attr('cx',-bw/2+12).attr('cy',0).attr('r',3.5).attr('fill',co);
      var lb=(id||'');if(lb.indexOf('/')>=0)lb=lb.split('/')[1];if(lb.length>16)lb=lb.slice(0,14)+'..';el.append('text').attr('x',-bw/2+20).attr('y',4.5).style('font-size','8.5px').style('fill','#1a1a2e').style('font-weight','600').text(lb);
      var ci=n.properties&&n.properties.callInbound||0,co2=n.properties&&n.properties.callOutbound||0;if(ci||co2)el.append('text').attr('x',bw/2-8).attr('y',-1).style('font-size','7.5px').style('fill','#f59e0b').style('text-anchor','end').style('font-weight','600').text((ci?'↓'+fmt(ci)+' ':'')+(co2?'↑'+fmt(co2):''));var depRisk=n.properties&&n.properties.depRisk;if(depRisk==='high')el.append('text').attr('x',-bw/2+10).attr('y',-bh/2-3).style('font-size','9px').text('⚠️').attr('title','依赖风险：单点服务')
    ne.push(el)});

  ne.forEach(function(el){el.on('mouseenter',function(){var id=el.attr('data-id'),cn=new Set();cn.add(id);gd.edges.forEach(function(e){if(e.source===id&&e.type==='CALLS')cn.add(e.target);if(e.target===id&&e.type==='CALLS')cn.add(e.source)});ne.forEach(function(n){n.attr('opacity',cn.has(n.attr('data-id'))?1:.07)});ee.forEach(function(eg){var h=(eg.attr('data-s')===id||eg.attr('data-t')===id)&&eg.attr('data-tp')==='CALLS';eg.attr('opacity',h?1:.02);if(h)eg.select('path').attr('marker-end','url(#ah)')})}).on('mouseleave',function(){ne.forEach(function(n){n.attr('opacity',1)});ee.forEach(function(eg){eg.attr('opacity',1);eg.select('path').attr('marker-end','url(#ac)')})}).on('click',function(){showPopover(nm[el.attr('data-id')])})});
}

// ========== LOOKUP ==========
function renderLookup(){
  svg.selectAll('*').remove();ee=null;ne=null;
  var W=Math.max(canvas.clientWidth||1400,1200),H=Math.max(canvas.clientHeight||800,680);
  svg.attr('width',W).attr('height',H);

  var nm={};gd.nodes.forEach(function(n){nm[n.id]=n});
  var dp=gd.nodes.filter(function(n){return n.group==='Deployment'}),gr={};dp.forEach(function(d){gr[d.id]={up:{},down:{}}});
  gd.edges.forEach(function(e){if(e.type!=='CALLS')return;var cc=e.properties&&e.properties.callCount||1;if(gr[e.source]&&gr[e.target]){gr[e.source].down[e.target]=(gr[e.source].down[e.target]||0)+cc;gr[e.target].up[e.source]=(gr[e.target].up[e.source]||0)+cc}});
  function sh(id){var n=id.split('/')[1]||id;return n.length>20?n.slice(0,18)+'..':n}

  var defs=svg.append('defs');defs.append('pattern').attr('id','dot').attr('width',40).attr('height',40).attr('patternUnits','userSpaceOnUse').append('circle').attr('cx',20).attr('cy',20).attr('r',.5).attr('fill','rgba(0,0,0,.035)');
  defs.append('marker').attr('id','ac').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-4L8,0L0,4Z').attr('fill','#f59e0b');
  defs.append('filter').attr('id','sh').html('<feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.05"/>');

  var g=svg.append('g');svg.call(d3.zoom().scaleExtent([.2,5]).on('zoom',function(e){g.attr('transform',e.transform)}));
  g.append('rect').attr('width',W*3).attr('height',H*3).attr('x',-W).attr('y',-H).attr('fill','url(#dot)');

  if(!lkp||!gr[lkp]){
    var hc=dp.filter(function(s){return Object.keys(gr[s].up).length||Object.keys(gr[s].down).length});
    if(!hc.length){g.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').style('font-size','14px').style('fill','#94a3b8').text('暂无调用数据，请刷新');return}
    g.append('text').attr('x',W/2).attr('y',24).attr('text-anchor','middle').style('font-size','13px').style('font-weight','700').style('fill','#1a1a2e').text('点击服务查看上下游调用链（'+hc.length+' 个服务有调用关系）');
    var cols=4,perC=Math.ceil(hc.length/cols);
    hc.forEach(function(s,i){var c=Math.floor(i/perC),r=i%perC,x=30+c*(W-60)/cols,y=48+r*20,un=Object.keys(gr[s].up).length,dn=Object.keys(gr[s].down).length,n2=nm[s],hcv=n2&&n2.properties&&n2.properties.healthCode;
      var tg=g.append('g').attr('cursor','pointer').on('click',(function(sid){return function(){lkp=sid;renderLookup()}})(s));
      tg.append('circle').attr('cx',x).attr('cy',y-3).attr('r',3).attr('fill',hcv?hcc(hcv):'#94a3b8');
      tg.append('text').attr('x',x+8).attr('y',y).style('font-size','9px').style('fill','#475569').style('font-weight','500').text(sh(s));
      tg.append('text').attr('x',x+170).attr('y',y).style('font-size','7.5px').style('fill','#94a3b8').text('←'+un+'/'+dn+'→')});
    return}

  var gD=gr[lkp],ups=Object.keys(gD.up).sort(function(a,b){return gD.up[b]-gD.up[a]}),dns=Object.keys(gD.down).sort(function(a,b){return gD.down[b]-gD.down[a]}),cx=W/2,cy=H/2,nw=220,nh2=42;
  g.append('text').attr('x',W-30).attr('y',24).attr('text-anchor','end').style('font-size','12px').style('fill','#6366f1').style('cursor','pointer').style('font-weight','600').text('← 返回').on('click',function(){lkp=null;renderLookup()});

  var nc2=nm[lkp],hcv2=nc2&&nc2.properties&&nc2.properties.healthCode,co3=hcv2?hcc(hcv2):'#6366f1';
  g.append('rect').attr('x',cx-nw/2).attr('y',cy-nh2/2).attr('width',nw).attr('height',nh2).attr('rx',10).attr('fill','#fff').attr('stroke',co3).attr('stroke-width',2.5).attr('filter','url(#sh)');
  g.append('rect').attr('x',cx-nw/2).attr('y',cy-nh2/2).attr('width',3.5).attr('height',nh2).attr('rx',2).attr('fill',co3);
  g.append('text').attr('x',cx).attr('y',cy+6).attr('text-anchor','middle').style('font-size','14px').style('font-weight','800').style('fill','#1a1a2e').text(sh(lkp));
  var ti=0,to=0;ups.forEach(function(s){ti+=gD.up[s]});dns.forEach(function(s){to+=gD.down[s]});
  g.append('text').attr('x',cx).attr('y',cy-nh2/2-12).attr('text-anchor','middle').style('font-size','10px').style('fill','#94a3b8').text('← '+ups.length+' 上游 ('+fmt(ti)+')  |  '+dns.length+' 下游 ('+fmt(to)+') →');

  function drawNode(sid,x,y,accent,edgeX,getCC,isUp){
    var n=nm[sid];if(!n)return;var cc=getCC(),w=170,h2=30;var hcv=n&&n.properties&&n.properties.healthCode,co=hcv?hcc(hcv):accent;
    g.append('rect').attr('x',x-w/2).attr('y',y-h2/2).attr('width',w).attr('height',h2).attr('rx',7).attr('fill','#fff').attr('stroke',co).attr('stroke-width',1.5).attr('cursor','pointer').on('click',(function(s2){return function(){lkp=s2;renderLookup()}})(sid));
    g.append('rect').attr('x',x-w/2).attr('y',y-h2/2).attr('width',3).attr('height',h2).attr('rx',2).attr('fill',co);
    g.append('text').attr('x',x-w/2+10).attr('y',y+4.5).style('font-size','9px').style('fill','#1a1a2e').style('font-weight','600').text(sh(sid));
    var ex=isUp?x+w/2:x-w/2,mx=(ex+edgeX)/2,my=(y+cy)/2,sw=Math.max(1,Math.min(Math.log10(cc+1)*2,3.5));
    g.append('path').attr('d','M'+ex+','+y+' Q'+mx+','+my+' '+edgeX+','+cy).attr('fill','none').attr('stroke','#f59e0b').attr('stroke-width',sw).attr('marker-end','url(#ac)');
    if(cc>0){var l=fmt(cc);g.append('text').attr('x',mx).attr('y',my-5).attr('text-anchor','middle').style('font-size','7.5px').style('fill','#b45309').style('font-weight','700').text(l)}
  }
  if(ups.length){g.append('text').attr('x',cx-300).attr('y',44).attr('text-anchor','middle').style('font-size','10px').style('fill','#94a3b8').style('font-weight','600').text('上游（调用方）');ups.forEach(function(s,i){drawNode(s,cx-300,62+i*36,'#6366f1',cx-nw/2,function(){return gD.up[s]},true)})}
  if(dns.length){g.append('text').attr('x',cx+300).attr('y',44).attr('text-anchor','middle').style('font-size','10px').style('fill','#94a3b8').style('font-weight','600').text('下游（被调用方）');dns.forEach(function(s,i){drawNode(s,cx+300,62+i*36,'#10b981',cx+nw/2,function(){return gD.down[s]},false)})}
}

function epath(s,t,c){if(!c)return'M'+s.x+','+s.y+' L'+t.x+','+t.y;var mx=(s.x+t.x)/2,my=(s.y+t.y)/2;return'M'+s.x+','+s.y+' Q'+mx+','+my+' '+t.x+','+t.y}

function showPopover(d){
  if(!d)return;var p=d.properties||{},h='<div style="font-weight:700;font-size:13px;margin-bottom:6px">'+d.id+'</div>';
  if(d.group==='Deployment'){
    var hcv=p.healthCode||'-';h+='<div style="font-size:11px;margin-bottom:4px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+hcc(hcv)+';margin-right:5px"></span>'+hcv+' | '+(p.riskLevel||'-')+'</div>';
    if(p.callInbound!==undefined)h+='<div style="font-size:11px;margin-bottom:2px">↓'+fmt(p.callInbound||0)+' 入站 &nbsp; ↑'+fmt(p.callOutbound||0)+' 出站 &nbsp; '+fmt(p.callPeerCount||0)+' 关联</div>';
    if(p.currentCost!==undefined)h+='<div style="font-size:11px;color:#64748b">月成本 ¥'+p.currentCost.toFixed(2)+'</div>';
    if(p.monthlySaving>0)h+='<div style="font-size:11px;color:#10b981">可节省 ¥'+p.monthlySaving.toFixed(2)+'</div>';
  }
  popC.html(h);pop.style('display','block').style('left','50%').style('top','50%').style('transform','translate(-50%,-50%)');
}

window.refreshTopo=function(){
  var bt=event&&event.target;if(bt){bt.disabled=true;bt.textContent='刷新中...'}
  fetch('/api/topology/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(d){if(d.error)alert(d.error);else load()}).catch(function(e){alert(e.message)}).finally(function(){if(bt){bt.disabled=false;bt.textContent='刷新'}})};
window.cleanupTopo=function(){if(!confirm('确定清除？'))return;fetch('/api/topology/cleanup',{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){if(d.error)alert(d.error);else{svg.selectAll('*').remove();svg.html('<text x="30" y="60" fill="#94a3b8">已清理</text>')}}).catch(function(e){alert(e.message)})};
load();
})();
</script>
</body>
</html>
{{end}}
